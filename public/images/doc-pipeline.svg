<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215"/>
      <stop offset="50%" stop-color="#0e181c"/>
      <stop offset="100%" stop-color="#14242a"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgMesh)"/>

  <!-- Blueprint Grid -->
  <g stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Flow Paths connecting nodes -->
  <path d="M 140 250 L 260 250" stroke="url(#cyanLine)" stroke-width="3" filter="url(#neon)"/>
  <path d="M 380 250 L 460 190 L 580 190" stroke="url(#cyanLine)" stroke-width="3" filter="url(#neon)"/>
  <path d="M 380 250 L 460 310 L 580 310" stroke="url(#cyanLine)" stroke-width="3" filter="url(#neon)"/>
  <path d="M 700 190 L 730 250 L 700 310" stroke="#00d4ff" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>

  <!-- Flow Particle Dots -->
  <circle cx="200" cy="250" r="4" fill="#00d4ff" filter="url(#neon)"/>
  <circle cx="520" cy="190" r="4" fill="#22c55e" filter="url(#neon)"/>
  <circle cx="520" cy="310" r="4" fill="#ffb703" filter="url(#neon)"/>

  <!-- Node 01: Ingestion Sources -->
  <g transform="translate(60, 200)">
    <rect width="100" height="100" rx="10" fill="#132328" stroke="#00d4ff" stroke-width="1.8"/>
    <rect x="8" y="8" width="84" height="20" rx="4" fill="#00d4ff" fill-opacity="0.15"/>
    <text x="50" y="22" font-family="monospace" font-size="9" fill="#00d4ff" font-weight="bold" text-anchor="middle">INGESTION</text>
    <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Unstructured</text>
    <text x="50" y="68" font-family="sans-serif" font-size="11" fill="#888888" text-anchor="middle">PDFs / Scans</text>
    <circle cx="50" cy="85" r="4" fill="#00d4ff"/>
  </g>

  <!-- Node 02: Azure Vision & Layout Analysis -->
  <g transform="translate(260, 190)">
    <rect width="130" height="120" rx="10" fill="#132328" stroke="#00d4ff" stroke-width="2" filter="url(#neon)"/>
    <rect x="8" y="8" width="114" height="22" rx="4" fill="#00d4ff" fill-opacity="0.25"/>
    <text x="65" y="23" font-family="monospace" font-size="10" fill="#00d4ff" font-weight="bold" text-anchor="middle">OCR &amp; LAYOUT</text>
    <text x="65" y="55" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Azure AI Vision</text>
    <text x="65" y="75" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">99.4% Precision</text>
    <text x="65" y="95" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">LayoutLMv3 Embed</text>
  </g>

  <!-- Node 03A: Spark Streaming & Delta Extraction -->
  <g transform="translate(580, 130)">
    <rect width="130" height="100" rx="10" fill="#132328" stroke="#22c55e" stroke-width="1.8"/>
    <rect x="8" y="8" width="114" height="20" rx="4" fill="#22c55e" fill-opacity="0.15"/>
    <text x="65" y="22" font-family="monospace" font-size="9" fill="#22c55e" font-weight="bold" text-anchor="middle">TRANSFORMATION</text>
    <text x="65" y="52" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Spark Stream</text>
    <text x="65" y="72" font-family="monospace" font-size="10" fill="#00d4ff" text-anchor="middle">Delta Lake Tables</text>
  </g>

  <!-- Node 03B: Semantic Search & Schema Mapping -->
  <g transform="translate(580, 270)">
    <rect width="130" height="100" rx="10" fill="#132328" stroke="#ffb703" stroke-width="1.8"/>
    <rect x="8" y="8" width="114" height="20" rx="4" fill="#ffb703" fill-opacity="0.15"/>
    <text x="65" y="22" font-family="monospace" font-size="9" fill="#ffb703" font-weight="bold" text-anchor="middle">STRUCTURED SERVE</text>
    <text x="65" y="52" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">JSON Schema API</text>
    <text x="65" y="72" font-family="monospace" font-size="10" fill="#ffb703" text-anchor="middle">p99 &lt; 38ms</text>
  </g>

  <!-- Header Annotations -->
  <text x="40" y="45" font-family="monospace" font-size="11" fill="#00d4ff" font-weight="bold" letter-spacing="2">BLUEPRINT // 01 · SYSTEM TOPOLOGY</text>
  <text x="40" y="65" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">Intelligent Document Processing Pipeline</text>
  <text x="760" y="45" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="end">AZURE AI · SPARK · DELTA</text>
</svg>


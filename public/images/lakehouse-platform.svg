<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b1e"/>
      <stop offset="50%" stop-color="#112429"/>
      <stop offset="100%" stop-color="#18363e"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="lakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgLake)"/>

  <!-- Blueprint Grid -->
  <g stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Flow Streams connecting layers -->
  <path d="M 145 250 L 225 250" stroke="url(#goldLine)" stroke-width="3" filter="url(#lakeGlow)"/>
  <path d="M 345 250 L 425 250" stroke="url(#goldLine)" stroke-width="3" filter="url(#lakeGlow)"/>
  <path d="M 545 250 L 625 250" stroke="url(#goldLine)" stroke-width="3" filter="url(#lakeGlow)"/>

  <!-- Ingestion Layer (Eventstream / IoT / CDC) -->
  <g transform="translate(45, 185)">
    <rect width="105" height="130" rx="10" fill="#132a30" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="8" y="8" width="89" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="52" y="23" font-family="monospace" font-size="9" fill="#f59e0b" font-weight="bold" text-anchor="middle">EVENTSTREAM</text>
    <text x="52" y="55" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Real-Time CDC</text>
    <text x="52" y="75" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">5M events/sec</text>
    <text x="52" y="95" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">Kafka / Event Hub</text>
  </g>

  <!-- Bronze Delta (Raw Lakehouse) -->
  <g transform="translate(225, 185)">
    <rect width="120" height="130" rx="10" fill="#132a30" stroke="#cd7f32" stroke-width="1.8"/>
    <rect x="8" y="8" width="104" height="22" rx="4" fill="#cd7f32" fill-opacity="0.2"/>
    <text x="60" y="23" font-family="monospace" font-size="9" fill="#e0a96d" font-weight="bold" text-anchor="middle">BRONZE LAYER</text>
    <text x="60" y="55" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Raw Delta Parquet</text>
    <text x="60" y="75" font-family="monospace" font-size="10" fill="#00d4ff" text-anchor="middle">OneLake Storage</text>
    <text x="60" y="95" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">Schema Enforcement</text>
  </g>

  <!-- Silver Delta (Enriched Lakehouse) -->
  <g transform="translate(425, 175)">
    <rect width="120" height="150" rx="10" fill="#132a30" stroke="#00d4ff" stroke-width="2" filter="url(#lakeGlow)"/>
    <rect x="8" y="8" width="104" height="24" rx="4" fill="#00d4ff" fill-opacity="0.25"/>
    <text x="60" y="24" font-family="monospace" font-size="10" fill="#00d4ff" font-weight="bold" text-anchor="middle">SILVER / GOLD</text>
    <text x="60" y="58" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Microsoft Fabric</text>
    <text x="60" y="80" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">Liquid Clustering</text>
    <text x="60" y="100" font-family="monospace" font-size="9" fill="#00d4ff" text-anchor="middle">Z-Order Optimization</text>
    <text x="60" y="120" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">ACID Transactions</text>
  </g>

  <!-- Serving & Analytics Layer (KQL & DirectLake) -->
  <g transform="translate(625, 185)">
    <rect width="130" height="130" rx="10" fill="#132a30" stroke="#10b981" stroke-width="1.8"/>
    <rect x="8" y="8" width="114" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="65" y="23" font-family="monospace" font-size="9" fill="#10b981" font-weight="bold" text-anchor="middle">SERVING LAYER</text>
    <text x="65" y="55" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">KQL Database</text>
    <text x="65" y="75" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">p99 &lt; 28ms Query</text>
    <text x="65" y="95" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">DirectLake BI Cache</text>
  </g>

  <!-- Header Annotations -->
  <text x="40" y="45" font-family="monospace" font-size="11" fill="#00d4ff" font-weight="bold" letter-spacing="2">BLUEPRINT // 03 · SYSTEM TOPOLOGY</text>
  <text x="40" y="65" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">Real-Time Lakehouse Telemetry &amp; Analytics Platform</text>
  <text x="760" y="45" font-family="monospace" font-size="10" fill="#10b981" text-anchor="end">FABRIC · ONELAKE · DELTA · KQL</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Paper texture & gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#ebdccb"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbf8f2"/>
      <stop offset="100%" stop-color="#ece2d0"/>
    </linearGradient>
    <linearGradient id="foldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8cbb7"/>
      <stop offset="100%" stop-color="#bfb099"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#007799"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="12" flood-color="#3d2e1e" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Atelier Card -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#2b231c" stroke-opacity="0.05" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
  </g>

  <!-- Technical Calibrated Arc -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="#655592" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="300" r="245" fill="none" stroke="#2b231c" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Robot Drop Shadow -->
  <ellipse cx="300" cy="495" rx="140" ry="24" fill="#2d2218" opacity="0.16"/>

  <g filter="url(#shadow)">
    <!-- Antenna -->
    <path d="M 300 135 L 300 85" stroke="#7a6c5b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="300" cy="78" r="10" fill="url(#accentAmber)" filter="url(#glow)"/>
    <circle cx="300" cy="78" r="4" fill="#ffffff"/>

    <!-- Head Origami Facets -->
    <polygon points="210,140 390,140 420,250 180,250" fill="url(#robotBody)"/>
    <polygon points="180,250 210,140 250,195" fill="url(#foldDark)" opacity="0.3"/>
    <polygon points="390,140 420,250 350,195" fill="url(#foldDark)" opacity="0.4"/>
    <polygon points="210,140 300,165 390,140" fill="#ffffff" opacity="0.7"/>

    <!-- Screen Visor -->
    <rect x="225" y="165" width="150" height="60" rx="12" fill="#1e1e1e" stroke="#655592" stroke-width="2"/>
    <!-- Glowing Eye Lenses -->
    <circle cx="265" cy="195" r="14" fill="url(#accentCyan)" filter="url(#glow)"/>
    <circle cx="265" cy="195" r="6" fill="#ffffff"/>
    <circle cx="335" cy="195" r="14" fill="url(#accentCyan)" filter="url(#glow)"/>
    <circle cx="335" cy="195" r="6" fill="#ffffff"/>
    
    <!-- Torso -->
    <polygon points="200,265 400,265 425,415 175,415" fill="url(#robotBody)"/>
    <polygon points="175,415 200,265 240,340" fill="url(#foldDark)" opacity="0.35"/>
    <polygon points="400,265 425,415 360,340" fill="url(#foldDark)" opacity="0.45"/>
    <polygon points="240,340 300,415 360,340 300,265" fill="#ffffff" opacity="0.5"/>

    <!-- Chest Blueprint Display -->
    <rect x="240" y="295" width="120" height="75" rx="6" fill="#132328" stroke="#00d4ff" stroke-width="1.5"/>
    <path d="M 252 315 L 275 315 L 290 335 L 320 335 L 348 315" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="252" cy="315" r="3.5" fill="#00d4ff"/>
    <circle cx="290" cy="335" r="3.5" fill="#ffb703"/>
    <circle cx="348" cy="315" r="3.5" fill="#00d4ff"/>
    <text x="300" y="358" font-family="monospace" font-size="9" fill="#00d4ff" text-anchor="middle" letter-spacing="1">TELEMETRY: OK</text>

    <!-- Arms & Hands -->
    <!-- Left Arm -->
    <path d="M 195 285 L 140 330 L 145 390" stroke="#7a6c5b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="145" cy="390" r="14" fill="#ffffff" stroke="#7a6c5b" stroke-width="3"/>
    <!-- Right Arm holding Glowing Mini Blueprint -->
    <path d="M 405 285 L 460 335 L 440 380" stroke="#7a6c5b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(435, 370) rotate(-15)">
      <rect width="55" height="40" rx="3" fill="#132328" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
      <line x1="8" y1="12" x2="47" y2="12" stroke="#00d4ff" stroke-width="2"/>
      <line x1="8" y1="20" x2="35" y2="20" stroke="#ffb703" stroke-width="1.5"/>
      <line x1="8" y1="28" x2="42" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    </g>

    <!-- Base / Feet -->
    <polygon points="215,415 265,415 255,475 200,475" fill="url(#foldDark)"/>
    <polygon points="335,415 385,415 400,475 345,475" fill="url(#foldDark)"/>
    <rect x="195" y="465" width="70" height="20" rx="5" fill="#3a3028"/>
    <rect x="335" y="465" width="70" height="20" rx="5" fill="#3a3028"/>
  </g>

  <!-- Corner Distressed Spec Marks -->
  <text x="35" y="50" font-family="monospace" font-size="10" fill="#655592" font-weight="bold" letter-spacing="2">UNIT 734 // AUTONOMOUS OPERATIVE</text>
  <text x="35" y="565" font-family="monospace" font-size="9" fill="#7a6c5b" letter-spacing="1.5">SPEC: DAG REASONING TRACE // FABRIC &amp; AZURE AI</text>
</svg>


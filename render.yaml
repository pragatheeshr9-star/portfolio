services:
  - type: web
    name: pragatheesh-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_GROUNDTRUTH_API_URL
        value: https://pragatheesh-groundtruth.onrender.com
      - key: NEXT_PUBLIC_STEADYAGENT_API_URL
        value: https://pragatheesh-steadyagent.onrender.com
      - key: NEXT_PUBLIC_TOKENSENSE_API_URL
        value: https://pragatheesh-tokensense.onrender.com
      - key: NEXT_PUBLIC_SMALLWINS_API_URL
        value: https://pragatheesh-smallwins.onrender.com

  - type: web
    name: pragatheesh-groundtruth
    runtime: docker
    plan: free
    dockerfilePath: ./groundtruth/Dockerfile
    dockerContext: ./groundtruth
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PORTFOLIO_HOST
        value: pragatheesh-portfolio.onrender.com

  - type: web
    name: pragatheesh-steadyagent
    runtime: docker
    plan: free
    dockerfilePath: ./steadyagent/Dockerfile
    dockerContext: ./steadyagent
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PORTFOLIO_HOST
        value: pragatheesh-portfolio.onrender.com

  - type: web
    name: pragatheesh-tokensense
    runtime: docker
    plan: free
    dockerfilePath: ./tokensense/Dockerfile
    dockerContext: ./tokensense
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PORTFOLIO_HOST
        value: pragatheesh-portfolio.onrender.com

  - type: web
    name: pragatheesh-smallwins
    runtime: docker
    plan: free
    dockerfilePath: ./smallwins/Dockerfile
    dockerContext: ./smallwins
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PORTFOLIO_HOST
        value: pragatheesh-portfolio.onrender.com

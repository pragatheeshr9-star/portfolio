[project]
name = "groundtruth"
version = "0.1.0"
description = "Evaluation-first technical documentation RAG"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

